[project]
name = "ai-studio-story"
version = "1.0.0"
description = "A set of Python tool to help generate stories for Lunii device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "numpy>=2.4.2",
    "Pillow>=10.0.0",
    "pydub>=0.25.0",
    "PyYAML>=6.0",
]

[project.scripts]
kidstory-audio = "audio_generation.cli:main"
kidstory-cover = "image_generation.cli_cover:main"
kidstory-thumbnail = "image_generation.cli_thumbnail:main"
kidstory-build = "story_export.pipeline_cli:main"
kidstory-export = "story_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_generation", "image_generation", "story_export"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
